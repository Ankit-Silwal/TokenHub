name: TokenHub checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tokenhub
          POSTGRES_PASSWORD: tokenhub
          POSTGRES_DB: tokenhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokenhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub
      - run: npm run format:check
      - run: npm run build
      - run: npm run check -w cli
      - name: Package standalone CLI
        run: npm pack ./cli
      - name: Verify installed CLI
        run: |
          npm install --global --prefix "$RUNNER_TEMP/tokenhub-cli" ./tokenhub-cli-0.2.0.tgz
          "$RUNNER_TEMP/tokenhub-cli/bin/tokenhub" --help
      - uses: actions/upload-artifact@v4
        with:
          name: tokenhub-cli
          path: tokenhub-cli-*.tgz
      - run: npm test
      - name: Verify authorization and concurrency on PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  cli-platforms:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cli/tests/*.test.mjs
      - name: Verify repository archive installation
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=package/ --output=tokenhub-source.tgz HEAD
          npm install --global --prefix "$RUNNER_TEMP/tokenhub-source" ./tokenhub-source.tgz
          node "$(npm root --global --prefix "$RUNNER_TEMP/tokenhub-source")/tokenhub/cli/bin/tokenhub.mjs" --version
