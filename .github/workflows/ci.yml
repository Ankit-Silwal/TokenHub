name: TokenHub checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tokenhub
          POSTGRES_PASSWORD: tokenhub
          POSTGRES_DB: tokenhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokenhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Verify authorization and concurrency on PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://tokenhub:tokenhub@localhost:5432/tokenhub
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
