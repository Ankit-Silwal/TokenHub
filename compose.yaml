services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokenhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenhub}
      POSTGRES_DB: tokenhub
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenhub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
